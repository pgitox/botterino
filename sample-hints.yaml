# Sample hints for botterino. Copy them into botterino-config/hints.yaml
#
# - hints use yaml syntax, indent by two spaces
# - each entry uses the same name as a round in rounds.yaml
# - 'time' is the number of minutes after the round is posted
# - hints.yaml can be edited while a round is running, it is checked every 30 seconds
# - check your hints with `python -m botterino.validate`

# hints for the round named vegas_round in sample-rounds.yaml
vegas_round:
  hints:
    - time: 20
      text: "This is the first hint for the vegas round."
    - time: 60
      text: "This is the first hourly hint for the vegas round."
    - time: 120
      text: "This is the second hourly hint for the vegas round."
    - time: 180
      text: "This is the third hourly hint for the vegas round."
    - time: 240
      text: "This is the fourth hourly hint for the vegas round."
