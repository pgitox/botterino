; fill in the values after the equals signs
; use ONE of the two options below, a second [botterino] section makes praw crash

; Option 1: username/password (use this if your account does NOT have 2fa)
[botterino]
client_id=
client_secret=
username=
password=
user_agent=botterino for /r/picturegame by /u/<your username>

; Option 2: OAuth (use this if your account has 2fa)
; fill in client_id and client_secret, run the bot once and log in through the browser,
; then paste the refresh_token it prints here
; [botterino]
; client_id=
; client_secret=
; refresh_token=
; user_agent=botterino for /r/picturegame by /u/<your username>
